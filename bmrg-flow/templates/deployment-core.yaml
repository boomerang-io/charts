{{- $platform := "bmrg" -}}
{{- $product := "flow" -}}
{{- $tier := "service" -}}
{{- $k := "core" -}}
{{- $values := .Values -}}
{{- $context := . -}}
{{- $v := $values.core -}}
{{- $mongo := $values.global.database.mongodb -}}
{{- $secretName := include "flow.secretName" . -}}
{{- $name := include "flow.core.serviceName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier "component" $k ) | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  # One pod at a time: the first new replica runs the migrations, the others start against a
  # migrated database instead of waiting on the migration lock.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: {{ $name }}
      {{- include "bmrg.labels.standard" (dict "context" $context "platform" $platform "product" $product "tier" $tier "component" $k "zone" $v.zone) | nindent 6 }}
  template:
    metadata:
      labels:
        name: {{ $name }}
        {{- include "bmrg.labels.standard" (dict "context" $context "platform" $platform "product" $product "tier" $tier "component" $k "zone" $v.zone) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") $ | sha256sum }}
    spec:
      containers:
        - name: "{{ $tier }}-{{ $k }}-cntr"
          image: {{ include "flow.image" (dict "context" $context "image" $v.image) | quote }}
          imagePullPolicy: "{{ $values.image.pullPolicy }}"
          env:
          {{- include "flow.env.common" $ | nindent 10 }}
          {{- /* MongoDB */}}
          {{- if $mongo.uriSecretName }}
          - name: SPRING_MONGODB_URI
            valueFrom:
              secretKeyRef:
                name: {{ $mongo.uriSecretName }}
                key: {{ $mongo.uriSecretKey }}
          {{- else }}
          {{- if $mongo.user }}
          - name: MONGODB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $mongo.secretName }}
                key: {{ if $mongo.secretName }}{{ $mongo.secretKey }}{{ else }}MONGODB_PASSWORD{{ end }}
          {{- end }}
          - name: SPRING_MONGODB_URI
            value: {{ include "flow.mongodb.uri" $ | quote }}
          {{- end }}
          - name: FLOW_MONGO_COLLECTION_PREFIX
            value: {{ $mongo.collectionPrefix | quote }}
          {{- if $mongo.tls.enabled }}
          - name: SPRING_MONGODB_SSL_ENABLED
            value: "true"
          {{- if $mongo.tls.caSecretName }}
          # Spring SSL bundle built from the PEM CA; the driver trusts it without a keystore import
          - name: SPRING_MONGODB_SSL_BUNDLE
            value: mongodb
          - name: SPRING_SSL_BUNDLE_PEM_MONGODB_TRUSTSTORE_CERTIFICATE
            value: "file:/etc/certs/{{ $mongo.tls.caKey }}"
          {{- end }}
          {{- end }}
          {{- /* Security */}}
          - name: FLOW_SECURITY_ENABLED
            value: {{ $v.security.enabled | quote }}
          - name: FLOW_WORKSPACE_SINGLE
            value: {{ $v.workspace.single | quote }}
          {{- if $v.auth.oidc.issuer }}
          - name: FLOW_AUTH_OIDC_ISSUER
            value: {{ $v.auth.oidc.issuer | quote }}
          - name: FLOW_AUTH_OIDC_CLIENT_ID
            value: {{ $v.auth.oidc.clientId | quote }}
          {{- end }}
          # Always rendered: an absent FLOW_SECURITY_BOOTSTRAP_TOKEN revokes the stored token at start
          - name: FLOW_SECURITY_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $v.security.existingSecret }}
                key: FLOW_BOOTSTRAP_TOKEN
          # The first-admin activation code (flow.activation-code)
          - name: FLOW_ACTIVATION_CODE
            valueFrom:
              secretKeyRef:
                name: {{ $secretName }}
                key: FLOW_ACTIVATION_CODE
          {{- with $v.security.adminClaim }}
          {{- if .name }}
          - name: FLOW_SECURITY_ADMIN_CLAIM_NAME
            value: {{ .name | quote }}
          - name: FLOW_SECURITY_ADMIN_CLAIM_VALUES
            value: {{ .values | quote }}
          - name: FLOW_SECURITY_ADMIN_CLAIM_TRUST_FORWARDED_TOKEN
            value: {{ .trustForwardedToken | quote }}
          {{- end }}
          {{- end }}
          {{- /* Encryption of secured settings */}}
          - name: FLOW_ENCRYPT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $v.encrypt.existingSecret }}
                key: FLOW_ENCRYPT_SECRET
          - name: FLOW_ENCRYPT_SALT
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $v.encrypt.existingSecret }}
                key: FLOW_ENCRYPT_SALT
          {{- if or $v.encrypt.v3.existingSecret $v.encrypt.v3.secret }}
          - name: MONGO_ENCRYPT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $v.encrypt.v3.existingSecret }}
                key: MONGO_ENCRYPT_SECRET
          - name: MONGO_ENCRYPT_SALT
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName $v.encrypt.v3.existingSecret }}
                key: MONGO_ENCRYPT_SALT
          {{- end }}
          - name: FLOW_MIGRATION_RESET_UNREADABLE_SETTINGS
            value: {{ $v.migration.resetUnreadableSettings | quote }}
          {{- /* Public URLs */}}
          {{- if $values.global.ingress.enabled }}
          - name: FLOW_SERVICES_WORKFLOW_HOST
            value: {{ include "flow.externalUrl" $ | quote }}
          - name: FLOW_BASEURL
            value: "https://{{ $values.global.ingress.host }}"
          {{- end }}
          {{- if $values.global.auth.enabled }}
          - name: FLOW_SIGNOUTURL
            value: "{{ $values.global.auth.prefix }}/sign_out{{ if $values.global.auth.signOutRedirect }}?rd={{ $values.global.auth.signOutRedirect }}{{ end }}"
          {{- end }}
          {{- /* Artifacts */}}
          - name: FLOW_ARTIFACTS_ENABLED
            value: {{ $v.artifacts.enabled | quote }}
          {{- if $v.artifacts.enabled }}
          {{- with $v.artifacts.store }}
          - name: FLOW_ARTIFACTS_STORE_ENDPOINT
            value: {{ .endpoint | quote }}
          - name: FLOW_ARTIFACTS_STORE_LINK_ENDPOINT
            value: {{ .linkEndpoint | quote }}
          - name: FLOW_ARTIFACTS_STORE_REGION
            value: {{ .region | quote }}
          - name: FLOW_ARTIFACTS_STORE_BUCKET
            value: {{ .bucket | quote }}
          - name: FLOW_ARTIFACTS_STORE_PATH_STYLE
            value: {{ .pathStyle | quote }}
          - name: FLOW_ARTIFACTS_STORE_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName .existingSecret }}
                key: FLOW_ARTIFACTS_STORE_ACCESS_KEY
          - name: FLOW_ARTIFACTS_STORE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ default $secretName .existingSecret }}
                key: FLOW_ARTIFACTS_STORE_SECRET_KEY
          {{- end }}
          {{- end }}
          {{- /* Eventing */}}
          - name: FLOW_EVENTS_SINK_ENABLED
            value: {{ $v.eventing.enabled | quote }}
          {{- if $v.eventing.enabled }}
          - name: FLOW_EVENTS_SINK_URLS
            value: {{ $v.eventing.sinkUrls | quote }}
          {{- end }}
          - name: SPRINGDOC_SWAGGER_UI_ENABLED
            value: {{ $values.general.enable.apidocs | quote }}
          {{- if $values.general.enable.debug }}
          - name: LOGGING_LEVEL_IO_BOOMERANG
            value: DEBUG
          {{- end }}
          {{- with $v.env }}
          {{- include "flow.env.map" . | trim | nindent 10 }}
          {{- end }}
          {{- with $v.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
          - containerPort: 7700
            name: {{ $platform }}-port-cntr
            protocol: TCP
          # The images have no shell: every probe is HTTP. Nothing is served until the migrations
          # finish, so the startup probe carries the wait and liveness only starts after it passes.
          startupProbe:
            httpGet:
              path: /health
              port: {{ $platform }}-port-cntr
              scheme: HTTP
            periodSeconds: {{ $v.startupProbe.periodSeconds }}
            failureThreshold: {{ $v.startupProbe.failureThreshold }}
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: {{ $platform }}-port-cntr
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: {{ $platform }}-port-cntr
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          {{- include "bmrg.resources.chart" (dict "context" $.Values "item" $v "tier" $tier ) | nindent 10 }}
          {{- if and $mongo.tls.enabled $mongo.tls.caSecretName }}
          volumeMounts:
          - name: cert-vol-mongodb
            readOnly: true
            mountPath: "/etc/certs"
          {{- end }}
      {{- with $.Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $mongo.tls.enabled $mongo.tls.caSecretName }}
      volumes:
      - name: cert-vol-mongodb
        secret:
          secretName: {{ $mongo.tls.caSecretName }}
      {{- end }}
      {{- if $values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ $values.image.pullSecret }}
      {{- end }}
      restartPolicy: Always
