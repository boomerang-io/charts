{{- $platform := "bmrg" -}}
{{- $product := "flow" -}}
{{- $tier := "apps" -}}
{{- $k := "flow" -}}
{{- $values := .Values -}}
{{- $context := . -}}
{{- $v := $values.web -}}
{{- $name := include "flow.web.serviceName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier "component" $k ) | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      name: {{ $name }}
      {{- include "bmrg.labels.standard" (dict "context" $context "platform" $platform "product" $product "tier" $tier "component" $k "zone" $v.zone ) | nindent 6 }}
  template:
    metadata:
      labels:
        name: {{ $name }}
        {{- include "bmrg.labels.standard" (dict "context" $context "platform" $platform "product" $product "tier" $tier "component" $k "zone" $v.zone) | nindent 8 }}
    spec:
      containers:
        - name: {{ $tier }}-{{ $k }}-cntr
          image: {{ include "flow.image" (dict "context" $context "image" $v.image) | quote }}
          imagePullPolicy: {{ $values.image.pullPolicy }}
          env:
            # The base path is built into client-web; it matches the /apps/flow ingress path.
            - name: APP_ROOT
              value: "/apps/flow"
            - name: PORT
              value: "3000"
            # Browser-facing API URL, shown where the app surfaces a copyable webhook or event URL
            - name: PRODUCT_SERVICE_ENV_URL
              value: "{{ default "" $values.global.ingress.root }}/api/v2"
            # Every service-core call is made server-side at this in-cluster address
            - name: CORE_SERVICE_INTERNAL_ORIGIN
              value: "http://{{ include "flow.core.serviceName" $ }}:7700"
            {{- with $v.env }}
            {{- include "flow.env.map" . | trim | nindent 12 }}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
          - containerPort: 3000
            name: {{ $platform }}-port-cntr
            protocol: TCP
          livenessProbe:
            httpGet:
              path: /apps/flow/health
              port: {{ $platform }}-port-cntr
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /apps/flow/health
              port: {{ $platform }}-port-cntr
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          {{- include "bmrg.resources.chart" (dict "context" $.Values "item" $v "tier" $tier ) | nindent 10 }}
      {{- if $values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ $values.image.pullSecret }}
      {{- end }}
      restartPolicy: Always
