{{- $platform := "bmrg" -}}
{{- $product := "flow" -}}
{{- $tier := "api" -}}
{{- $values := .Values -}}
{{- $context := . -}}
{{- if $values.global.ingress.enabled -}}
{{- $root := default "" $values.global.ingress.root -}}
{{- $prefix := $values.global.ingress.annotationsPrefix -}}
# service-core's public API: direct API use with a Flow token, webhooks and CloudEvents, and the
# GitHub and Slack callbacks (/api/v2/integration/...). Never behind the sign-in proxy: these
# callers authenticate with tokens or signatures, not a browser session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bmrg.name" (dict "context" $context "tier" $tier ) }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier ) | nindent 4 }}
  annotations:
    {{ $prefix }}/proxy-connect-timeout: "600"
    # Streamed responses (a running task's log, an artifact download) stay open for up to two hours
    {{ $prefix }}/proxy-read-timeout: "7200"
    {{ $prefix }}/proxy-send-timeout: "7200"
    {{ $prefix }}/ssl-redirect: "true"
    {{- if $root }}
    {{ $prefix }}/rewrite-target: /$1
    {{ $prefix }}/use-regex: "true"
    {{- end }}
    {{ $prefix }}/proxy-body-size: 16m
    {{- with $values.global.ingress.api.limitRps }}
    {{ $prefix }}/limit-rps: {{ . | quote }}
    {{- end }}
    {{- with $values.global.ingress.api.limitConnections }}
    {{ $prefix }}/limit-connections: {{ . | quote }}
    {{- end }}
    {{- with $values.global.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $values.global.ingress.class }}
  rules:
    - host: {{ $values.global.ingress.host }}
      http:
        paths:
          - path: {{ $root }}/{{ if $root }}(api/v2(?:/.*)?)${{ else }}api/v2{{ end }}
            pathType: {{ if $root }}ImplementationSpecific{{ else }}Prefix{{ end }}
            backend:
              service:
                name: {{ include "flow.core.serviceName" $ }}
                port:
                  name: {{ $platform }}-port-svc
          {{- if $values.general.enable.apidocs }}
          - path: {{ $root }}/{{ if $root }}(api/docs(?:/.*)?)${{ else }}api/docs{{ end }}
            pathType: {{ if $root }}ImplementationSpecific{{ else }}Prefix{{ end }}
            backend:
              service:
                name: {{ include "flow.core.serviceName" $ }}
                port:
                  name: {{ $platform }}-port-svc
          {{- end }}
  tls:
    - hosts:
        - {{ $values.global.ingress.host }}
      {{- if $values.global.ingress.tlsSecretName }}
      secretName: {{ $values.global.ingress.tlsSecretName }}
      {{- end }}
{{- end }}
