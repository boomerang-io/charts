{{- $tier := "rbac" -}}
{{- $context := . -}}
{{- if and .Values.dispatcher.enabled .Values.dispatcher.rbac.create }}
# The dispatcher's own namespace Role. Each verb is one the dispatcher's Kubernetes client (fabric8)
# makes (service-dispatcher/src/main/java/io/boomerang/kube, dispatcher/TaskRuntimeReconciler.java,
# dispatcher/WorkspaceReconciler.java). A label-selected delete (withLabels(..).delete()) is sent as
# one DELETE on the collection, which Kubernetes authorises as `deletecollection`, not `delete`.
# Task pods run under dispatcher.tasks.serviceAccount, not this account.
# Verify: kubectl auth can-i deletecollection jobs --as=system:serviceaccount:<namespace>:{{ include "flow.dispatcher.serviceAccountName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bmrg.name" (dict "context" $context "component" "dispatcher" ) }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier ) | nindent 4 }}
rules:
  # kube-jobs executor: a Job per task, watched by label, removed by label with its pods
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  # Task pods are found by label for their status, termination message and log
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  # Workspace volumes: created and waited on until bound, released by label by the workspace reconciler
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
  # A task's script, projected into its pod and removed by label with the Job
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - deletecollection
{{- if eq .Values.dispatcher.executor "tekton" }}
  # tekton executor: a TaskRun per task, removed by label; cancel updates the status subresource
- apiGroups:
  - tekton.dev
  resources:
  - taskruns
  verbs:
  - create
  - get
  - list
  - watch
  - delete
  - deletecollection
- apiGroups:
  - tekton.dev
  resources:
  - taskruns/status
  verbs:
  - get
  - update
{{- end }}
{{- end }}
