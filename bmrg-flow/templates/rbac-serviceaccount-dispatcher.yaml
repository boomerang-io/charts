{{- $tier := "rbac" -}}
{{- $context := . -}}
{{- if and .Values.dispatcher.enabled .Values.dispatcher.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flow.dispatcher.serviceAccountName" . }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier ) | nindent 4 }}
{{- end }}
