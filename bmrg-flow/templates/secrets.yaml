{{- $platform := "bmrg" -}}
{{- $product := "flow" -}}
{{- $tier := "secrets" -}}
{{- $values := .Values -}}
{{- $context := . -}}
{{- $name := include "flow.secretName" . -}}
{{- /*
Generated values are kept across upgrades by reading the existing Secret back (lookup). An explicit
value in values.yaml always wins over the stored one.
Solution by https://github.com/helm/charts/issues/5167
*/ -}}
{{- /* Activation code (flow.activation-code, 32+ characters). A release upgraded from chart 5.x keeps its FLOW_OTC value. */ -}}
{{- $activation := randAlphaNum 48 -}}
{{- $encryptSecret := default (randAlphaNum 32) $values.core.encrypt.secret -}}
{{- $encryptSalt := default (randAlphaNum 32) $values.core.encrypt.salt -}}
{{- $bootstrap := default (printf "bfg_%s" (randAlphaNum 40)) $values.core.security.bootstrapToken -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- if $existing -}}
  {{- with (index $existing.data "FLOW_ACTIVATION_CODE") }}{{ $activation = . | b64dec }}{{ end -}}
  {{- if not (index $existing.data "FLOW_ACTIVATION_CODE") }}{{ with (index $existing.data "FLOW_OTC") }}{{ $activation = . | b64dec }}{{ end }}{{ end -}}
  {{- if not $values.core.encrypt.secret }}{{ with (index $existing.data "FLOW_ENCRYPT_SECRET") }}{{ $encryptSecret = . | b64dec }}{{ end }}{{ end -}}
  {{- if not $values.core.encrypt.salt }}{{ with (index $existing.data "FLOW_ENCRYPT_SALT") }}{{ $encryptSalt = . | b64dec }}{{ end }}{{ end -}}
  {{- if not $values.core.security.bootstrapToken }}{{ with (index $existing.data "FLOW_BOOTSTRAP_TOKEN") }}{{ $bootstrap = . | b64dec }}{{ end }}{{ end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier ) | nindent 4 }}
type: Opaque
data:
  {{- with $values.global.database.mongodb }}
  {{- if and (not .uriSecretName) (not .secretName) .user }}
  MONGODB_PASSWORD: {{ .password | toString | b64enc }}
  {{- end }}
  {{- end }}
  FLOW_ACTIVATION_CODE: {{ $activation | b64enc }}
  FLOW_BOOTSTRAP_TOKEN: {{ $bootstrap | b64enc }}
  FLOW_ENCRYPT_SECRET: {{ $encryptSecret | b64enc }}
  FLOW_ENCRYPT_SALT: {{ $encryptSalt | b64enc }}
  {{- with $values.core.encrypt.v3 }}
  {{- if and (not .existingSecret) .secret }}
  MONGO_ENCRYPT_SECRET: {{ .secret | b64enc }}
  MONGO_ENCRYPT_SALT: {{ .salt | b64enc }}
  {{- end }}
  {{- end }}
  {{- with $values.core.artifacts }}
  {{- if and .enabled (not .store.existingSecret) }}
  FLOW_ARTIFACTS_STORE_ACCESS_KEY: {{ .store.accessKey | b64enc }}
  FLOW_ARTIFACTS_STORE_SECRET_KEY: {{ .store.secretKey | b64enc }}
  {{- end }}
  {{- end }}
