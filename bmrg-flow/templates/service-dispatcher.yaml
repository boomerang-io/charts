{{- $platform := "bmrg" -}}
{{- $product := "flow" -}}
{{- $tier := "service" -}}
{{- $k := "dispatcher" -}}
{{- $context := . -}}
{{- $v := .Values.dispatcher -}}
{{- if $v.enabled -}}
{{- $name := include "flow.dispatcher.serviceName" . -}}
# service-core reads a running task's live log from the dispatcher at this Service
# (FLOW_DISPATCHER_LOGS_URL).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bmrg.labels.chart" (dict "context" $context "tier" $tier "component" $k ) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: {{ $platform }}-port-svc
      port: 7702
      targetPort: {{ $platform }}-port-cntr
      protocol: TCP
  selector:
    name: {{ $name }}
    {{- include "bmrg.labels.standard" (dict "context" $context "platform" $platform "product" $product "tier" $tier "component" $k "zone" $v.zone) | nindent 4 }}
  sessionAffinity: None
{{- end }}
