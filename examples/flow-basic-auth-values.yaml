# Flow v5 with the bundled oauth2-proxy in basic-auth (htpasswd) mode, no external identity provider.
global:
  database:
    mongodb:
      host: bmrg-mongodb
      secretName: bmrg-mongodb
  ingress:
    enabled: true
    host: host.example.io
    class: "nginx"
    tlsSecretName: example-tls
  auth:
    enabled: true
    mode: basic
    serviceName: flow-auth-proxy
    prefix: /oauth
    signOutRedirect: /apps/flow

oauth2proxy:
  enabled: true
  config:
    cookieName: bmrg_flow_basic
    cookieSecret: <base64 32 bytes>
    clientID: unused
    clientSecret: unused
  htpasswdFile:
    enabled: true
    entries:
    - <user>:<bcrypt hash>
  extraArgs:
    provider: oidc
    skip-provider-button: "true"
    cookie-path: /
    cookie-secure: "true"
    http-address: 0.0.0.0:4180
    set-xauthrequest: "true"
    proxy-prefix: /oauth
    redirect-url: https://host.example.io/oauth/callback
    custom-templates-dir: /custom/templates
    upstream: file:///dev/null
  ingress:
    enabled: true
    className: nginx
    hosts:
    - host.example.io
    path: /oauth
    tls:
    - secretName: example-tls
      hosts:
      - host.example.io
