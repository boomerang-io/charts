# Flow v5 with the bundled oauth2-proxy signing users in with GitHub (proxy mode).
global:
  database:
    mongodb:
      host: bmrg-mongodb
      secretName: bmrg-mongodb
  ingress:
    enabled: true
    host: host.example.io
    class: "nginx"
    tlsSecretName: example-tls
  auth:
    enabled: true
    mode: oauth
    serviceName: flow-auth-proxy
    prefix: /oauth
    signOutRedirect: /apps/flow

oauth2proxy:
  enabled: true
  config:
    cookieName: bmrg_flow_github
    cookieSecret: <base64 32 bytes>
    clientID: <github oauth app client id>
    clientSecret: <github oauth app client secret>
  extraArgs:
    provider: github
    cookie-path: /
    cookie-secure: "true"
    http-address: 0.0.0.0:4180
    scope: "user:email read:user"
    set-xauthrequest: "true"
    proxy-prefix: /oauth
    redirect-url: https://host.example.io/oauth/callback
    custom-templates-dir: /custom/templates
    upstream: file:///dev/null
  ingress:
    enabled: true
    className: nginx
    hosts:
    - host.example.io
    path: /oauth
    tls:
    - secretName: example-tls
      hosts:
      - host.example.io
